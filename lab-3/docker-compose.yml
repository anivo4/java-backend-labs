services:
  postgres:
    image: postgres:18-alpine
    container_name: laba3-postgres
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass
      PGDATA: /var/lib/postgresql/18/docker/pgdata
    ports:
      - "5433:5432"
    volumes:
    - ./postgres-data:/var/lib/postgresql
    restart: unless-stopped